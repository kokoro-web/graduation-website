<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>訪問率の差分地図</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
    body {
        margin: 0;
        font-family: Arial, "Noto Sans JP", sans-serif;
        background: #f2f2f2;
        color: #333;
    }

    header {
        background: #333;
        color: white;
        padding: 18px 30px;
        font-size: 24px;
        font-weight: bold;
    }

    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .controls {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .controls label {
        font-weight: bold;
        margin-right: 8px;
    }

    select {
        padding: 8px 12px;
        font-size: 16px;
        margin-right: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: white;
    }

    button {
        padding: 9px 18px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background: #444;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #222;
    }

    #map {
        height: 650px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .legend {
        background: white;
        padding: 12px 14px;
        line-height: 20px;
        color: #333;
        box-shadow: 0 1px 5px rgba(0,0,0,0.2);
        border-radius: 5px;
    }

    .legend-title {
        font-weight: bold;
        margin-bottom: 6px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        margin: 3px 0;
    }

    .legend-color {
        width: 22px;
        height: 18px;
        margin-right: 7px;
        border: 1px solid #999;
    }

    .back-top {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #444;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 18px;
        z-index: 9999;
    }

    .back-top:hover {
        background: #222;
    }

    .error {
        background: #ffe5e5;
        color: #b00000;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
    }
</style>
</head>

<body>

<header>
    訪問率の差分地図
</header>

<div class="container">

    <div class="controls">

        <label for="country">国籍：</label>
        <select id="country">
            <option value="韓国">韓国</option>
            <option value="台湾">台湾</option>
            <option value="香港">香港</option>
            <option value="中国">中国</option>
            <option value="タイ">タイ</option>
            <option value="シンガポール">シンガポール</option>
            <option value="マレーシア">マレーシア</option>
            <option value="インドネシア">インドネシア</option>
            <option value="フィリピン">フィリピン</option>
            <option value="ベトナム">ベトナム</option>
            <option value="インド">インド</option>
            <option value="英国">英国</option>
            <option value="ドイツ">ドイツ</option>
            <option value="フランス">フランス</option>
            <option value="イタリア">イタリア</option>
            <option value="スペイン">スペイン</option>
            <option value="ロシア">ロシア</option>
            <option value="米国">米国</option>
            <option value="カナダ">カナダ</option>
            <option value="オーストラリア">オーストラリア</option>
        </select>

        <label for="startYear">開始年：</label>
        <select id="startYear"></select>

        <label for="endYear">終了年：</label>
        <select id="endYear"></select>

        <button onclick="drawDiffMap()">差分を表示</button>

    </div>

    <div id="error" class="error"></div>

    <div id="map"></div>

</div>

<button class="back-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">
    ↑
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const years = [
    2015,
    2016,
    2017,
    2018,
    2019,
    2023,
    2024,
    2025
];

const startSelect = document.getElementById("startYear");
const endSelect = document.getElementById("endYear");

years.forEach(year => {

    const option1 = document.createElement("option");
    option1.value = year;
    option1.textContent = year;

    const option2 = document.createElement("option");
    option2.value = year;
    option2.textContent = year;

    startSelect.appendChild(option1);
    endSelect.appendChild(option2);

});

startSelect.value = 2015;
endSelect.value = 2025;


// ----------------------------------------
// 都道府県名を統一する
// ----------------------------------------

function normalizePrefName(name) {

    return String(name)
        .replace(/^\uFEFF/, "")
        .replace(/["']/g, "")
        .replace(/\s+/g, "")
        .replace(/　/g, "")
        .replace(/[都府県]$/, "")
        .trim();

}


// ----------------------------------------
// CSVを読み込む
// ----------------------------------------

function parseCSV(text, country) {

    const rows = text
        .replace(/\r/g, "")
        .split("\n")
        .filter(row => row.trim() !== "");

    const header = rows[0]
        .split(",")
        .map(h =>
            h
                .replace(/^\uFEFF/, "")
                .replace(/["']/g, "")
                .trim()
        );

    const idx = header.findIndex(
        h => h === country
    );

    const data = {};

    if (idx === -1) {
        console.error(
            "国籍の列が見つかりません：",
            country
        );
        return data;
    }

    for (let i = 1; i < rows.length; i++) {

        const cols = rows[i].split(",");

        if (cols.length <= idx) {
            continue;
        }

        const pref = normalizePrefName(cols[0]);

        const value = Number(
            cols[idx]
                .replace(/"/g, "")
                .trim()
        );

        if (pref !== "") {
            data[pref] = value;
        }
    }

    return data;
}


// ----------------------------------------
// 差分の色
// ----------------------------------------

function getColor(v) {

    if (v >= 10) {
        return "#800026";
    }

    if (v >= 5) {
        return "#E31A1C";
    }

    if (v >= 0) {
        return "#FC8D59";
    }

    if (v >= -5) {
        return "#91BFDB";
    }

    if (v >= -10) {
        return "#4575B4";
    }

    return "#313695";
}


// ----------------------------------------
// 地図
// ----------------------------------------

let map = L.map("map", {
    zoomControl: true
}).setView([36.2, 138.2], 5);

let geojsonLayer = null;


// ----------------------------------------
// 差分地図を描画
// ----------------------------------------

async function drawDiffMap() {

    const country =
        document.getElementById("country").value;

    const startYear =
        document.getElementById("startYear").value;

    const endYear =
        document.getElementById("endYear").value;

    const errorBox =
        document.getElementById("error");

    errorBox.style.display = "none";
    errorBox.textContent = "";


    try {

        // CSV読み込み

        const startResponse =
            await fetch(`${startYear}_clean.csv`);

        const endResponse =
            await fetch(`${endYear}_clean.csv`);

        const geoResponse =
            await fetch("japan.geojson");


        if (!startResponse.ok) {
            throw new Error(
                `${startYear}_clean.csv が読み込めません`
            );
        }

        if (!endResponse.ok) {
            throw new Error(
                `${endYear}_clean.csv が読み込めません`
            );
        }

        if (!geoResponse.ok) {
            throw new Error(
                "japan.geojson が読み込めません"
            );
        }


        const startText =
            await startResponse.text();

        const endText =
            await endResponse.text();

        const geoData =
            await geoResponse.json();


        // CSVをデータ化

        const startData =
            parseCSV(startText, country);

        const endData =
            parseCSV(endText, country);


        console.log(
            `${startYear} ${country}`,
            startData
        );

        console.log(
            `${endYear} ${country}`,
            endData
        );


        // 以前のレイヤーを削除

        if (geojsonLayer) {
            geojsonLayer.remove();
        }


        // GeoJSON

        geojsonLayer = L.geoJSON(
            geoData,
            {

                style: function(feature) {

                    const prefOriginal =
                        feature.properties.nam_ja;

                    // ★ここが今回の修正ポイント
                    // 「都・府・県」を文字列の最後から1文字だけ削除
                    //
                    // 京都府 → 京都
                    // 大阪府 → 大阪
                    // 東京都 → 東京
                    // 神奈川県 → 神奈川

                    const prefShort =
                        prefOriginal.replace(
                            /[都府県]$/,
                            ""
                        );


                    const startVal =
                        startData[prefOriginal] ??
                        startData[prefShort] ??
                        0;

                    const endVal =
                        endData[prefOriginal] ??
                        endData[prefShort] ??
                        0;

                    const diff =
                        endVal - startVal;


                    return {

                        fillColor:
                            getColor(diff),

                        weight: 1,

                        color: "#666",

                        fillOpacity: 0.75

                    };

                },


                onEachFeature:
                    function(feature, layer) {

                        const prefOriginal =
                            feature.properties.nam_ja;

                        // ★最後の「都・府・県」だけ削除

                        const prefShort =
                            prefOriginal.replace(
                                /[都府県]$/,
                                ""
                            );


                        const startVal =
                            startData[prefOriginal] ??
                            startData[prefShort] ??
                            0;

                        const endVal =
                            endData[prefOriginal] ??
                            endData[prefShort] ??
                            0;

                        const diff =
                            endVal - startVal;


                        layer.bindPopup(`

                            <div style="font-size:14px;">

                                <strong>
                                    ${prefShort}
                                </strong>

                                <hr>

                                ${startYear}年：
                                ${startVal.toFixed(1)}%

                                <br>

                                ${endYear}年：
                                ${endVal.toFixed(1)}%

                                <br>

                                <strong>
                                    差分：
                                    ${diff >= 0 ? "+" : ""}
                                    ${diff.toFixed(1)}%
                                </strong>

                            </div>

                        `);

                    }

            }

        ).addTo(map);


        // 日本全体が画面に入るようにする

        map.fitBounds(
            geojsonLayer.getBounds()
        );


        // 凡例

        const legend =
            L.control({
                position: "bottomright"
            });


        legend.onAdd = function() {

            const div =
                L.DomUtil.create(
                    "div",
                    "legend"
                );

            div.innerHTML = `

                <div class="legend-title">
                    差分（${endYear}年 − ${startYear}年）
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color"
                        style="background:#800026">
                    </div>
                    ＋10以上
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color"
                        style="background:#E31A1C">
                    </div>
                    ＋5～＋10
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color"
                        style="background:#FC8D59">
                    </div>
                    0～＋5
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color"
                        style="background:#91BFDB">
                    </div>
                    −5～0
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color"
                        style="background:#4575B4">
                    </div>
                    −10～−5
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color"
                        style="background:#313695">
                    </div>
                    −10以下
                </div>

            `;

            return div;
        };


        legend.addTo(map);

    }

    catch(error) {

        console.error(error);

        errorBox.textContent =
            "データの読み込み中にエラーが発生しました。";

        errorBox.style.display = "block";

    }

}


// ----------------------------------------
// 最初に表示
// ----------------------------------------

drawDiffMap();

</script>

</body>
</html>
