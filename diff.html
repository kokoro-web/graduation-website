<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>都道府県訪問率差分分析</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{.back-button{
    position:absolute;
    top:15px;
    left:15px;
    padding:8px 15px;
    background:#999;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

header{
    background:#333;
    color:white;
    padding:30px;
}

.control-box{
    width:85%;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
    text-align:center;
}

h1{
    margin-top:30px;
}

.description{
    margin-bottom:20px;
    color:#555;
}

#controls{
    margin:20px;
}

select,button{
    padding:8px 12px;
    font-size:15px;
    margin:5px;
}

button{
    background:#333;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#555;
}

#resultTitle{
    font-size:22px;
    font-weight:bold;
    margin:20px;
}

#map{
    width:90%;
    height:700px;
    margin:auto;
    background:white;
    border:1px solid #ccc;
}

.legend{
    background:white;
    padding:10px;
    border:1px solid #ccc;
    line-height:1.7;
    font-size:13px;
}

</style>

</head>

<body>
    <a href="index.html" class="back-button">
← トップ
</a>

<header>
<h1>差分分析</h1>
<p>任意の2年間を比較し、都道府県訪問率の増減を可視化</p>
</header>

<div class="control-box">

<h1>都道府県訪問率差分分析</h1>

<p class="description">
開始年と終了年を選択し、
国籍別の都道府県訪問率の変化を可視化します。
</p>

<div id="controls">

<select id="country">

<option>韓国</option>
<option>台湾</option>
<option>香港</option>
<option>中国</option>
<option>タイ</option>
<option>シンガポール</option>
<option>マレーシア</option>
<option>インドネシア</option>
<option>フィリピン</option>
<option>ベトナム</option>
<option>インド</option>
<option>英国</option>
<option>ドイツ</option>
<option>フランス</option>
<option>イタリア</option>
<option>スペイン</option>
<option>ロシア</option>
<option>米国</option>
<option>カナダ</option>
<option>オーストラリア</option>

</select>

<select id="startYear">

<option>2015</option>
<option>2016</option>
<option>2017</option>
<option>2018</option>
<option>2019</option>
<option>2023</option>
<option>2024</option>
<option>2025</option>

</select>

<select id="endYear">

<option>2015</option>
<option>2016</option>
<option>2017</option>
<option>2018</option>
<option>2019</option>
<option>2023</option>
<option>2024</option>
<option selected>2025</option>

</select>

<button onclick="drawDiffMap()">
表示
</button>

</div>

<div id="resultTitle">
比較条件を選択してください
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map',{
    zoomControl:true
}).setView([37.5,137],5);

let geoLayer;

function parseCSV(text,country){

    const rows = text
        .replace(/\r/g,"")
        .split("\n");

    const header = rows[0].split(",");

    const idx = header.findIndex(
        h => h.trim() === country
    );

    const data = {};

    for(let i=1;i<rows.length;i++){

        const cols = rows[i].split(",");

        if(cols.length <= idx) continue;

        const pref = cols[0]
            .replace(/^\uFEFF/,"")
            .trim();

        data[pref] =
            Number(cols[idx]);

    }

    return data;
}

function getColor(v){

    return v >= 20 ? "#800026" :
           v >= 15 ? "#BD0026" :
           v >= 10 ? "#E31A1C" :
           v >= 5  ? "#FC4E2A" :
           v >= 0  ? "#FD8D3C" :
           v >= -5 ? "#6BAED6" :
           v >= -10? "#4292C6" :
           v >= -15? "#2171B5" :
                     "#084594";
}

async function drawDiffMap(){

    const country =
        document.getElementById("country").value;

    const startYear =
        document.getElementById("startYear").value;

    const endYear =
        document.getElementById("endYear").value;

    document.getElementById("resultTitle").innerHTML =
        country + "　" +
        startYear + " → " +
        endYear + " 差分分析";

    const startCsv =
        await fetch(`${startYear}_clean.csv`);

    const endCsv =
        await fetch(`${endYear}_clean.csv`);

    const startText =
        await startCsv.text();

    const endText =
        await endCsv.text();

    const startData =
        parseCSV(startText,country);

    const endData =
        parseCSV(endText,country);

    const geojson =
        await fetch("japan.geojson");

    const geoData =
        await geojson.json();

    geoData.features.forEach(feature=>{

        const pref =
            feature.properties.nam_ja
                .replace("都","")
                .replace("府","")
                .replace("県","");

        const startVal =
            startData[pref] || 0;

        const endVal =
            endData[pref] || 0;

        feature.properties.startVal = startVal;
feature.properties.endVal = endVal;
feature.properties.diff = endVal - startVal;

    });

    if(geoLayer){
        map.removeLayer(geoLayer);
    }

    geoLayer = L.geoJSON(geoData,{

        style:function(feature){

            return{
                fillColor:
                    getColor(
                        feature.properties.diff
                    ),
                weight:1,
                color:"#444",
                fillOpacity:0.8
            };
        },

        onEachFeature:function(feature,layer){

    const diff =
        feature.properties.diff;

    const sign =
        diff > 0 ? "+" : "";

    layer.bindPopup(

        "<b>" +
        feature.properties.nam_ja +
        "</b><br><br>" +

        startYear + "年 : " +
        feature.properties.startVal.toFixed(1) +
        "%<br>" +

        endYear + "年 : " +
        feature.properties.endVal.toFixed(1) +
        "%<br><br>" +

        "差分 : " +
        sign +
        diff.toFixed(1) +
        "%"

    );
}
            );
        }

    }).addTo(map);

    map.fitBounds(
        geoLayer.getBounds()
    );

}

const legend =
    L.control({
        position:'bottomright'
    });

legend.onAdd = function(){

    const div =
        L.DomUtil.create(
            'div',
            'legend'
        );

    div.innerHTML =

    "<b>差分 (%)</b><br>" +

    "<span style='color:#800026'>■</span> +20以上<br>" +
    "<span style='color:#E31A1C'>■</span> +10～20<br>" +
    "<span style='color:#FD8D3C'>■</span> 0～10<br>" +

    "<span style='color:#6BAED6'>■</span> -5～0<br>" +
    "<span style='color:#2171B5'>■</span> -15～-5<br>" +
    "<span style='color:#084594'>■</span> -15以下";

    return div;
};

legend.addTo(map);

</script>

</body>
</html>
